name: Horizon Scheduled Cycle

on:
  schedule:
    - cron: '17 */4 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: horizon-scheduled-cycle
  cancel-in-progress: false

jobs:
  horizon-cycle:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: intelligent-agency
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Install agency + test deps
        run: pip install -r requirements.txt pytest

      - name: Run tests before Horizon cycle
        run: pytest -q

      # A mock cycle is a simulation, not durable learning. Do not restore or
      # save a persistent state cache when no non-mock provider is explicitly
      # configured. This also avoids reusing legacy mock memory in simulation.
      # If a provider is configured, state remains bounded and cache-scoped to
      # this workflow as before.
      - name: Restore Horizon state
        if: vars.AGENCY_LLM != '' && vars.AGENCY_LLM != 'mock'
        uses: actions/cache@v6
        with:
          path: intelligent-agency/.horizon
          key: horizon-state-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            horizon-state-

      - name: Run Horizon cycle
        env:
          HORIZON_STATE_DIR: .horizon
          # Prefer a real provider when repository variables/secrets are set.
          # If nothing is configured, fall back to mock so the scheduled cycle
          # keeps running instead of failing with exit 2.
          AGENCY_LLM: ${{ vars.AGENCY_LLM || 'mock' }}
          AGENCY_LLM_BASE_URL: ${{ vars.AGENCY_LLM_BASE_URL }}
          AGENCY_LLM_MODEL: ${{ vars.AGENCY_LLM_MODEL }}
          AGENCY_LLM_API_KEY: ${{ secrets.AGENCY_LLM_API_KEY }}
        run: |
          python - <<'PY'
          import json
          import os
          import sys
          sys.path.insert(0, 'src')
          from agency import build_agency
          from agency.runtime import HorizonRuntime
          from agency.state import StateStore

          p = build_agency()
          state_dir = os.environ.get('HORIZON_STATE_DIR', '.horizon')
          store = StateStore(os.path.join(state_dir, 'horizon.db'))
          print('memory rows on entry:', len(store.recall(limit=50)))
          runtime = HorizonRuntime(p.advisor, interval_seconds=14400,
                                   state_dir=state_dir, memory=store)
          result = runtime.run_once(
              'Run a scheduled HQ improvement scan. Inspect currently available HQ context, '
              'identify the highest-value verified improvement, and produce an auditable '
              'recommendation. Prefer registered projects in core/projects.yaml when relevant. '
              'Do not merge or perform consequential external actions.'
          )
          print('memory rows on exit:', len(store.recall(limit=50)))

          # Do not print the full answer or upload the state database/log. The
          # repository is public, and those can contain recalled context or
          # provider output. Emit only a sanitized status summary instead.
          safe_result = {key: result.get(key) for key in ('status', 'analysis_mode', 'cycle')}
          print('Horizon cycle summary:', safe_result)
          events = runtime.recent_events(limit=1)
          event = events[-1] if events else {}
          summary = {
              'started_at': event.get('started_at'),
              'finished_at': event.get('finished_at'),
              'status': result.get('status'),
              'analysis_mode': result.get('analysis_mode', 'unknown'),
              'cycle': result.get('cycle'),
          }
          with open('horizon-audit-summary.json', 'w', encoding='utf-8') as fh:
              json.dump(summary, fh, sort_keys=True)
              fh.write('\n')
          step_summary = os.environ.get('GITHUB_STEP_SUMMARY')
          if step_summary:
              with open(step_summary, 'a', encoding='utf-8') as fh:
                  fh.write('### Horizon scheduled cycle\n\n')
                  fh.write(f"- Status: `{summary['status']}`\n")
                  fh.write(f"- Analysis mode: `{summary['analysis_mode']}`\n")
                  fh.write(f"- Cycle: `{summary['cycle']}`\n")
          PY

      - name: Upload sanitized Horizon run summary
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: horizon-run-summary-${{ github.run_id }}
          path: intelligent-agency/horizon-audit-summary.json
          if-no-files-found: warn
          retention-days: 30
