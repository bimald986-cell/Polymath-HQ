name: Horizon Scheduled Cycle

on:
  schedule:
    - cron: '17 */4 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: horizon-scheduled-cycle
  cancel-in-progress: false

jobs:
  horizon-cycle:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: intelligent-agency
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install agency + test deps
        run: pip install -r requirements.txt pytest

      - name: Run tests before Horizon cycle
        run: pytest -q

      - name: Run Horizon cycle
        env:
          HORIZON_STATE_DIR: .horizon
          # Provider comes from repository configuration, never a hardcoded pin.
          # Configure repository variables AGENCY_LLM / AGENCY_LLM_BASE_URL /
          # AGENCY_LLM_MODEL and secret AGENCY_LLM_API_KEY to enable real reasoning.
          # With no provider configured this step FAILS (exit 2) rather than
          # silently emitting canned mock text into the artifact.
          AGENCY_LLM: ${{ vars.AGENCY_LLM || 'unset' }}
          AGENCY_LLM_BASE_URL: ${{ vars.AGENCY_LLM_BASE_URL }}
          AGENCY_LLM_MODEL: ${{ vars.AGENCY_LLM_MODEL }}
          AGENCY_LLM_API_KEY: ${{ secrets.AGENCY_LLM_API_KEY }}
        run: |
          python - <<'PY'
          import sys
          sys.path.insert(0, 'src')
          from agency import build_agency
          from agency.llm import LLMConfigError, require_live_backend
          from agency.runtime import HorizonRuntime

          try:
              require_live_backend()
          except LLMConfigError as exc:
              print(f"ERROR: {exc}", file=sys.stderr)
              raise SystemExit(2)

          p = build_agency()
          runtime = HorizonRuntime(p.advisor, interval_seconds=14400)
          result = runtime.run_once(
              'Run a scheduled HQ improvement scan. Inspect currently available HQ context, '
              'identify the highest-value verified improvement, and produce an auditable '
              'recommendation. Prefer registered projects in core/projects.yaml when relevant. '
              'Do not merge or perform consequential external actions.'
          )
          print(result)
          PY

      - name: Upload Horizon audit
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: horizon-audit-${{ github.run_id }}
          path: intelligent-agency/.horizon/
          include-hidden-files: true
          if-no-files-found: warn
          retention-days: 30
