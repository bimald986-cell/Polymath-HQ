name: Horizon Scheduled Cycle

on:
  schedule:
    - cron: '17 */4 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: horizon-scheduled-cycle
  cancel-in-progress: false

jobs:
  horizon-cycle:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: intelligent-agency
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install agency + test deps
        run: pip install -r requirements.txt pytest

      - name: Run tests before Horizon cycle
        run: pytest -q

      - name: Run one Horizon cycle
        env:
          HORIZON_STATE_DIR: .horizon
          # Mock LLM in Actions so the cycle does not depend on external API keys
          AGENCY_LLM: mock
        run: |
          python - <<'PY'
          import os, sys
          sys.path.insert(0, 'src')
          from agency import build_agency
          from agency.runtime import HorizonRuntime

          p = build_agency()
          runtime = HorizonRuntime(p.advisor, interval_seconds=14400)
          result = runtime.run_once(
              'Run a scheduled HQ improvement scan. Inspect currently available HQ context, '
              'identify the highest-value verified improvement, and produce an auditable '
              'recommendation. Prefer registered projects in core/projects.yaml when relevant '
              '(especially mind-mythos). Do not merge or perform consequential external actions.'
          )
          print(result)
          PY

      - name: Upload Horizon audit
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: horizon-audit-${{ github.run_id }}
          path: intelligent-agency/.horizon/
          if-no-files-found: warn
          retention-days: 30
